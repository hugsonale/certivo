name: labels

on:
  workflow_dispatch:
  push:
    branches: [rebuild, main]
    paths:
      - ".github/labels.json"
      - ".github/workflows/labels.yml"

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync repository labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const wanted = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner, repo, per_page: 100,
            });
            const byName = new Map(existing.map((l) => [l.name.toLowerCase(), l]));
            let created = 0, updated = 0, unchanged = 0;
            for (const label of wanted) {
              const current = byName.get(label.name.toLowerCase());
              if (!current) {
                await github.rest.issues.createLabel({
                  owner, repo, name: label.name, color: label.color, description: label.description,
                });
                created += 1;
              } else if (current.color.toLowerCase() !== label.color.toLowerCase()
                         || (current.description || '') !== label.description) {
                await github.rest.issues.updateLabel({
                  owner, repo, name: current.name, color: label.color, description: label.description,
                });
                updated += 1;
              } else {
                unchanged += 1;
              }
            }
            core.info(`Labels: ${created} created, ${updated} updated, ${unchanged} unchanged. Existing labels not in labels.json are left alone.`);
