name: platform-ci

on:
  push:
    branches: [rebuild, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint (platform)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  test-postgres:
    name: Tests and migration check on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: certivo
          POSTGRES_PASSWORD: certivo
          POSTGRES_DB: certivo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U certivo -d certivo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CERTIVO_DATABASE_URL: postgresql+psycopg://certivo:certivo@localhost:5432/certivo_test
      CERTIVO_TEST_DATABASE_URL: postgresql+psycopg://certivo:certivo@localhost:5432/certivo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Build the empty database from migrations only
        run: alembic upgrade head
      - name: Fail if the models and the migrations disagree
        run: alembic check
      - name: Run the full test suite on Postgres
        run: pytest

  docker-smoke:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - name: Make a throw-away signing key for this run
        run: |
          key="$(python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).rstrip(b'=').decode())")"
          echo "::add-mask::$key"
          echo "CERTIVO_ATTESTATION_SIGNING_KEY=$key" >> "$GITHUB_ENV"

      - name: Build the image and start Postgres and the API
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Run a scripted call against the running stack
        run: |
          set -euo pipefail
          output="$(docker compose exec -T api python scripts/create_partner.py "CI Partner")"
          key="$(printf '%s\n' "$output" | awk '/api_key/ {print $2}')"
          echo "::add-mask::$key"
          docker compose exec -T api python scripts/sandbox_call.py \
            --api-key "$key" --base-url http://127.0.0.1:8000 | tee call.txt
          grep -q "attestation signature verified: True" call.txt

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
