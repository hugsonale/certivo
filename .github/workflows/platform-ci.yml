name: platform-ci
on:
  push:
    branches: [rebuild, main]
  pull_request:
    paths: ["platform/**", "docs/spec/test-vectors/**", ".github/workflows/platform-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
