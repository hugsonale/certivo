name: Certivo CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ============================================================================
  # JOB 1: CODE QUALITY & LINTING
  # ============================================================================
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      
      - name: Run Black (code formatter check)
        run: black --check --diff .
        continue-on-error: true
      
      - name: Run isort (import sorting check)
        run: isort --check-only --diff .
        continue-on-error: true
      
      - name: Run Flake8 (linting)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        continue-on-error: true

  # ============================================================================
  # JOB 2: SECURITY SCANNING
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run Bandit (security linter)
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -ll
        continue-on-error: true
      
      - name: Run Safety (dependency vulnerability check)
        run: |
          pip install -r requirements.txt
          safety check --json || true
        continue-on-error: true

  # ============================================================================
  # JOB 3: UNIT TESTS
  # ============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libgomp1 \
            ffmpeg
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || pip install pytest pytest-cov pytest-asyncio
      
      - name: Create test database
        run: |
          python -c "from database import init_db; init_db()"
      
      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            -v \
            --tb=short
        env:
          ENVIRONMENT: test
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: htmlcov/

  # ============================================================================
  # JOB 4: INTEGRATION TESTS
  # ============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libgomp1 \
            ffmpeg
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || pip install pytest pytest-asyncio httpx
      
      - name: Run integration tests
        run: |
          pytest tests/test_integration.py -v --tb=short
        env:
          ENVIRONMENT: test

  # ============================================================================
  # JOB 5: BUILD & VALIDATE
  # ============================================================================
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate Python imports
        run: |
          python -c "import main; print('✅ Main module imports successfully')"
          python -c "import challenge_engine; print('✅ Challenge engine imports successfully')"
          python -c "import human_verification; print('✅ Human verification imports successfully')"
          python -c "import database; print('✅ Database module imports successfully')"
      
      - name: Check file structure
        run: |
          echo "📁 Checking critical files..."
          test -f main.py && echo "✅ main.py exists" || exit 1
          test -f challenge_engine.py && echo "✅ challenge_engine.py exists" || exit 1
          test -f human_verification.py && echo "✅ human_verification.py exists" || exit 1
          test -f database.py && echo "✅ database.py exists" || exit 1
          test -f requirements.txt && echo "✅ requirements.txt exists" || exit 1
          test -d admin && echo "✅ admin/ directory exists" || exit 1
          test -d frontend && echo "✅ frontend/ directory exists" || exit 1

  # ============================================================================
  # JOB 6: FRONTEND VALIDATION
  # ============================================================================
  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate HTML files
        run: |
          echo "📄 Validating HTML files..."
          find frontend -name "*.html" -type f | while read file; do
            echo "Checking $file"
            grep -q "<!DOCTYPE html>" "$file" && echo "✅ $file has DOCTYPE" || echo "⚠️ $file missing DOCTYPE"
          done
      
      - name: Check for broken links in HTML
        run: |
          echo "🔗 Checking for common issues..."
          ! grep -r "http://127.0.0.1" frontend/ && echo "✅ No localhost URLs in frontend" || echo "⚠️ Found localhost URLs"
      
      - name: Validate admin templates
        run: |
          echo "📄 Validating admin templates..."
          test -f admin/templates/base.html && echo "✅ base.html exists" || exit 1
          test -f admin/templates/dashboard.html && echo "✅ dashboard.html exists" || exit 1
          test -f admin/templates/login.html && echo "✅ login.html exists" || exit 1

  # ============================================================================
  # JOB 7: DOCKER BUILD (Optional - if using Docker)
  # ============================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM python:3.11-slim
          
          WORKDIR /app
          
          # Install system dependencies
          RUN apt-get update && apt-get install -y \
              libgl1-mesa-glx \
              libglib2.0-0 \
              libsm6 \
              libxext6 \
              libxrender-dev \
              libgomp1 \
              ffmpeg \
              && rm -rf /var/lib/apt/lists/*
          
          # Copy requirements
          COPY requirements.txt .
          
          # Install Python dependencies
          RUN pip install --no-cache-dir -r requirements.txt
          
          # Copy application
          COPY . .
          
          # Create necessary directories
          RUN mkdir -p logs uploads
          
          # Expose port
          EXPOSE 8000
          
          # Run application
          CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF
      
      - name: Build Docker image
        run: |
          docker build -t certivo:${{ github.sha }} .
          docker tag certivo:${{ github.sha }} certivo:latest
      
      - name: Test Docker image
        run: |
          docker run -d --name certivo-test -p 8000:8000 certivo:latest
          sleep 10
          curl -f http://localhost:8000/docs || exit 1
          docker stop certivo-test

  # ============================================================================
  # JOB 8: DEPLOYMENT (Production)
  # ============================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test, integration-test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://certivo.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy notification
        run: |
          echo "🚀 Deployment would happen here"
          echo "📦 Artifact: certivo-${{ github.sha }}"
          echo "🌍 Environment: production"
      
      # Add your actual deployment steps here:
      # - SSH to server
      # - Pull latest code
      # - Restart services
      # Example:
      # - name: Deploy to server
      #   uses: appleboy/ssh-action@master
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     key: ${{ secrets.SERVER_SSH_KEY }}
      #     script: |
      #       cd /opt/certivo
      #       git pull origin main
      #       pip install -r requirements.txt
      #       sudo systemctl restart certivo

  # ============================================================================
  # JOB 9: NOTIFICATION
  # ============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
      - name: Pipeline status
        run: |
          echo "Pipeline Status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"