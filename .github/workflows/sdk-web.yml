# Checks for the Web SDK (P0-21): lint, types, tests, build, bundle-size budget, dependency audit.
# Runs when something under sdk-web/ changes, and when the platform's test vectors change (the SDK must match them).
name: sdk-web

on:
  pull_request:
    paths:
      - "sdk-web/**"
      - "docs/spec/test-vectors/**"
      - ".github/workflows/sdk-web.yml"
  push:
    branches: [rebuild, main]
    paths:
      - "sdk-web/**"
      - "docs/spec/test-vectors/**"
      - ".github/workflows/sdk-web.yml"

permissions:
  contents: read

jobs:
  sdk-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-web
    steps:
      - uses: actions/checkout@v4
      # Node 24 brings npm 11. npm 10 crashes on the pinned test runner (see sdk-web/README.md).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk-web/package-lock.json
      - name: Show versions
        run: |
          node --version
          npm --version
      - name: Install exactly what the lock file says
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests (includes the architecture guards)
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size budget
        run: npm run size
      - name: Dependency audit
        run: npm audit --audit-level=high

  # P0-24: a real browser runs the SDK frame path and checks that no picture leaves the page or is kept.
  browser-test:
    name: browser-test (no media leaves the page)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk-web/package-lock.json
      - name: Install exactly what the lock file says
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser test
        run: npm run test:browser
      - name: Keep the failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: sdk-web/test-results
          if-no-files-found: ignore
