# Local monitoring (docker compose --profile monitoring up). Scrapes the API every 15 seconds.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# No Alertmanager yet: alerts show up on http://localhost:9090/alerts and in Grafana. How alerts are
# DELIVERED (email, chat, pager) is decided with the first real environment (docs/adr/0019).

scrape_configs:
  - job_name: certivo-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]
