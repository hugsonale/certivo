# Alembic configuration. Run the `alembic` command from the platform/ folder.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Migration files are named <revision>_<slug>.py and revisions are numbered by hand
# (0001, 0002, ...) so the order is obvious. Create one with:
#   alembic revision --autogenerate --rev-id 0002 -m "short description"
file_template = %%(rev)s_%%(slug)s

# Left empty on purpose: the URL comes from CERTIVO_DATABASE_URL (see migrations/env.py).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
