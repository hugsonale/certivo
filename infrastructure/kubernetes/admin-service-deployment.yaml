apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: certivo
spec:
  type: LoadBalancer
  selector:
    app: admin-service
  ports:
    - port: 8005
      targetPort: 8005

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: certivo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
      - name: admin-service
        image: certivo/admin-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_URL
          value: "postgresql://certivo:$(POSTGRES_PASSWORD)@postgres:5432/certivo"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: REDIS_PASSWORD
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379"
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: ADMIN_USERNAME
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: ADMIN_PASSWORD
        - name: ALLOWED_ADMIN_IPS
          valueFrom:
            configMapKeyRef:
              name: certivo-config
              key: ALLOWED_ADMIN_IPS
        - name: INTERNAL_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: INTERNAL_AUTH_TOKEN
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"