apiVersion: v1
kind: Service
metadata:
  name: challenge-service
  namespace: certivo
spec:
  selector:
    app: challenge-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: challenge-service
  namespace: certivo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: challenge-service
  template:
    metadata:
      labels:
        app: challenge-service
    spec:
      containers:
      - name: challenge-service
        image: certivo/challenge-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: REDIS_PASSWORD
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379"
        - name: CHALLENGE_TTL
          valueFrom:
            configMapKeyRef:
              name: certivo-config
              key: CHALLENGE_TTL
        - name: INTERNAL_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: INTERNAL_AUTH_TOKEN
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: challenge-service-hpa
  namespace: certivo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: challenge-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70