apiVersion: v1
kind: Service
metadata:
  name: async-worker
  namespace: certivo
spec:
  selector:
    app: async-worker
  ports:
    - port: 8004
      targetPort: 8004
  type: ClusterIP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-worker
  namespace: certivo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: async-worker
  template:
    metadata:
      labels:
        app: async-worker
    spec:
      containers:
      - name: async-worker
        image: certivo/async-worker:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: REDIS_PASSWORD
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_URL
          value: "postgresql://certivo:$(POSTGRES_PASSWORD)@postgres:5432/certivo"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: S3_SECRET_KEY
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: certivo-config
              key: S3_ENDPOINT
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: certivo-config
              key: S3_BUCKET
        - name: INTERNAL_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: INTERNAL_AUTH_TOKEN
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: async-worker-hpa
  namespace: certivo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: async-worker
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85