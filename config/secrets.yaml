# Secrets Configuration Template
# NEVER commit actual secrets to version control

# Environment-specific secret references
# Actual values stored in Vault/KMS

development:
  database:
    host: localhost
    port: 5432
    name: certivo_dev
    username: ${VAULT:secret/development/database/username}
    password: ${VAULT:secret/development/database/password}
  
  redis:
    url: ${VAULT:secret/development/redis/url}
  
  session:
    secret: ${VAULT:secret/development/session/secret}
  
  api_keys:
    internal: ${VAULT:secret/development/api/internal}

staging:
  database:
    host: db-staging.certivo.internal
    port: 5432
    name: certivo_staging
    username: ${VAULT:secret/staging/database/username}
    password: ${VAULT:secret/staging/database/password}
  
  redis:
    url: ${VAULT:secret/staging/redis/url}
  
  session:
    secret: ${VAULT:secret/staging/session/secret}
  
  api_keys:
    internal: ${VAULT:secret/staging/api/internal}

production:
  database:
    host: db-prod.certivo.internal
    port: 5432
    name: certivo_prod
    username: ${VAULT:secret/production/database/username}
    password: ${VAULT:secret/production/database/password}
  
  redis:
    url: ${VAULT:secret/production/redis/url}
  
  session:
    secret: ${VAULT:secret/production/session/secret}
  
  api_keys:
    internal: ${VAULT:secret/production/api/internal}
    external_service_a: ${VAULT:secret/production/api/external_service_a}
    external_service_b: ${VAULT:secret/production/api/external_service_b}
  
  encryption:
    master_key: ${VAULT:secret/production/encryption/master_key}
    data_key: ${VAULT:secret/production/encryption/data_key}