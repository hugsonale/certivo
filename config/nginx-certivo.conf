#############################################################################
# Certivo Nginx Configuration
#
# Installation:
#   sudo cp config/nginx-certivo.conf /etc/nginx/sites-available/certivo
#   sudo ln -s /etc/nginx/sites-available/certivo /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Prerequisites:
#   - Nginx installed: sudo apt install nginx
#   - Domain pointed to server IP
#   - SSL certificate (use certbot for Let's Encrypt)
#############################################################################

#############################################################################
# RATE LIMITING ZONES
#############################################################################

# General endpoints - 100 requests per second per IP
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;

# Challenge endpoint - 30 requests per minute per IP
limit_req_zone $binary_remote_addr zone=challenge:10m rate=30r/m;

# Verify endpoint - 10 requests per minute per IP (strict)
limit_req_zone $binary_remote_addr zone=verify:10m rate=10r/m;

# Admin endpoints - 50 requests per minute per IP
limit_req_zone $binary_remote_addr zone=admin:10m rate=50r/m;

#############################################################################
# UPSTREAM APPLICATION SERVERS
#############################################################################

upstream certivo_backend {
    # Primary application server
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    
    # For multiple workers/load balancing, add more servers:
    # server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
    
    # Keep connections alive for performance
    keepalive 32;
}

#############################################################################
# HTTP SERVER - Redirect to HTTPS
#############################################################################

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your actual domain
    server_name yourdomain.com www.yourdomain.com;
    
    # Let's Encrypt challenge location (for certificate renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

#############################################################################
# HTTPS SERVER - Main Application
#############################################################################

server {
    #########################################################################
    # BASIC CONFIGURATION
    #########################################################################
    
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Replace with your actual domain
    server_name yourdomain.com www.yourdomain.com;
    
    # Character encoding
    charset utf-8;
    
    # Server tokens off (hide nginx version)
    server_tokens off;
    
    #########################################################################
    # SSL/TLS CONFIGURATION
    #########################################################################
    
    # SSL Certificate paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;
    
    # For self-signed certificates (testing only):
    # ssl_certificate /etc/ssl/certs/certivo-selfsigned.crt;
    # ssl_certificate_key /etc/ssl/private/certivo-selfsigned.key;
    
    # SSL Protocols (TLS 1.2 and 1.3 only - secure)
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # SSL Ciphers (modern, secure)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL session cache (performance)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # OCSP stapling (verify certificate validity)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Diffie-Hellman parameters (generate with: openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048)
    # ssl_dhparam /etc/ssl/certs/dhparam.pem;
    
    #########################################################################
    # SECURITY HEADERS
    #########################################################################
    
    # HSTS (HTTP Strict Transport Security) - Force HTTPS for 2 years
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;
    
    # Permissions Policy (formerly Feature-Policy)
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), interest-cohort=()" always;
    
    #########################################################################
    # CLIENT SETTINGS
    #########################################################################
    
    # Maximum upload size (10MB for video uploads)
    client_max_body_size 10M;
    
    # Client timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    
    # Keep alive
    keepalive_timeout 65s;
    
    #########################################################################
    # LOGGING
    #########################################################################
    
    # Access log
    access_log /var/log/nginx/certivo_access.log combined;
    
    # Error log
    error_log /var/log/nginx/certivo_error.log warn;
    
    # Disable logging for specific paths (optional)
    # access_log off;
    
    #########################################################################
    # STATIC FILES
    #########################################################################
    
    # Main static files
    location /static/ {
        alias /opt/certivo/static/;
        
        # Cache control
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # CORS headers (if needed)
        # add_header Access-Control-Allow-Origin "*";
        
        # Gzip compression
        gzip_static on;
    }
    
    # Admin static files
    location /admin/static/ {
        alias /opt/certivo/admin/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }
    
    # Favicon
    location = /favicon.ico {
        alias /opt/certivo/static/favicon.ico;
        access_log off;
        log_not_found off;
    }
    
    # Robots.txt
    location = /robots.txt {
        alias /opt/certivo/static/robots.txt;
        access_log off;
        log_not_found off;
    }
    
    #########################################################################
    # API ENDPOINTS - WITH RATE LIMITING
    #########################################################################
    
    # Challenge endpoint - Moderate rate limit
    location /v1/challenge {
        # Rate limiting
        limit_req zone=challenge burst=5 nodelay;
        limit_req_status 429;
        
        # Proxy to backend
        proxy_pass http://certivo_backend;
        include /etc/nginx/proxy_params;
        
        # Custom timeout
        proxy_read_timeout 30s;
    }
    
    # Verify endpoint - Strict rate limit (video processing)
    location /v1/verify {
        # Strict rate limiting
        limit_req zone=verify burst=2 nodelay;
        limit_req_status 429;
        
        # Proxy to backend
        proxy_pass http://certivo_backend;
        include /etc/nginx/proxy_params;
        
        # Longer timeout for video processing
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    
    # Finalize endpoint
    location /v1/finalize {
        limit_req zone=general burst=10 nodelay;
        
        proxy_pass http://certivo_backend;
        include /etc/nginx/proxy_params;
    }
    
    # Device stats endpoint
    location /v1/device/ {
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://certivo_backend;
        include /etc/nginx/proxy_params;
    }
    
    #########################################################################
    # ADMIN DASHBOARD
    #########################################################################
    
    location /admin/ {
        # Rate limiting for admin
        limit_req zone=admin burst=20 nodelay;
        
        # Proxy to backend
        proxy_pass http://certivo_backend;
        include /etc/nginx/proxy_params;
        
        # Optional: Restrict to specific IPs
        # allow 192.168.1.0/24;
        # allow 10.0.0.0/8;
        # deny all;
    }
    
    #########################################################################
    # METRICS ENDPOINT (Prometheus)
    #########################################################################
    
    location /metrics {
        # Internal access only (localhost + monitoring server)
        allow 127.0.0.1;
        allow ::1;
        # allow 10.0.0.5;  # Add your monitoring server IP
        deny all;
        
        proxy_pass http://certivo_backend;
        include /etc/nginx/proxy_params;
    }
    
    #########################################################################
    # HEALTH CHECK ENDPOINT
    #########################################################################
    
    location /health {
        access_log off;
        
        proxy_pass http://certivo_backend;
        include /etc/nginx/proxy_params;
    }
    
    #########################################################################
    # API DOCUMENTATION
    #########################################################################
    
    # FastAPI auto-generated docs
    location /docs {
        proxy_pass http://certivo_backend;
        include /etc/nginx/proxy_params;
        
        # Optional: Password protect docs in production
        # auth_basic "API Documentation";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }
    
    location /redoc {
        proxy_pass http://certivo_backend;
        include /etc/nginx/proxy_params;
    }
    
    location /openapi.json {
        proxy_pass http://certivo_backend;
        include /etc/nginx/proxy_params;
    }
    
    #########################################################################
    # ROOT AND ALL OTHER REQUESTS
    #########################################################################
    
    # Root path
    location / {
        # General rate limiting
        limit_req zone=general burst=50 nodelay;
        
        # Proxy to backend
        proxy_pass http://certivo_backend;
        include /etc/nginx/proxy_params;
        
        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    #########################################################################
    # ERROR PAGES (Optional)
    #########################################################################
    
    # Custom 404 page
    # error_page 404 /404.html;
    # location = /404.html {
    #     root /opt/certivo/static/errors;
    #     internal;
    # }
    
    # Custom 50x pages
    # error_page 500 502 503 504 /50x.html;
    # location = /50x.html {
    #     root /opt/certivo/static/errors;
    #     internal;
    # }
    
    # Rate limit error page
    error_page 429 /429.html;
    location = /429.html {
        root /opt/certivo/static/errors;
        internal;
    }
}

#############################################################################
# NOTES:
#
# 1. Replace "yourdomain.com" with your actual domain
# 2. Replace SSL certificate paths with your actual paths
# 3. Adjust rate limits based on your needs
# 4. Test configuration: sudo nginx -t
# 5. Reload nginx: sudo systemctl reload nginx
#
# SSL Certificate Setup:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# Create proxy_params file if not exists:
#   /etc/nginx/proxy_params
#############################################################################