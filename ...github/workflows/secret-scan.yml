name: Secret Scanning

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  secret-scan:
    name: Scan for Hardcoded Secrets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection
      
      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/
      
      - name: Run Gitleaks scan
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-report.json \
            --verbose \
            --no-git
      
      - name: Check for high-confidence findings
        run: |
          if [ -f gitleaks-report.json ]; then
            # Count findings
            FINDINGS=$(cat gitleaks-report.json | jq 'length')
            echo "Total findings: $FINDINGS"
            
            if [ "$FINDINGS" -gt 0 ]; then
              echo "❌ FAIL: $FINDINGS secrets detected"
              cat gitleaks-report.json | jq '.'
              exit 1
            else
              echo "✅ PASS: 0 secrets detected"
            fi
          else
            echo "✅ PASS: 0 secrets detected"
          fi
      
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  trufflehog-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  detect-secrets:
    name: Detect-Secrets Baseline
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install detect-secrets
        run: pip install detect-secrets
      
      - name: Run detect-secrets scan
        run: |
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files '\.git/.*' \
            --exclude-files '.*\.md$' \
            . > scan-results.json || true
      
      - name: Check for new secrets
        run: |
          if [ -f scan-results.json ]; then
            NEW_SECRETS=$(cat scan-results.json | jq '.results | length')
            
            if [ "$NEW_SECRETS" -gt 0 ]; then
              echo "❌ FAIL: $NEW_SECRETS new secrets detected"
              cat scan-results.json | jq '.results'
              exit 1
            else
              echo "✅ PASS: No new secrets detected"
            fi
          fi
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detect-secrets-results
          path: scan-results.json

  secret-scan-summary:
    name: Secret Scan Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, trufflehog-scan, detect-secrets]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "# Secret Scan Summary"
          echo ""
          echo "✅ Gitleaks: ${{ needs.secret-scan.result }}"
          echo "✅ TruffleHog: ${{ needs.trufflehog-scan.result }}"
          echo "✅ Detect-Secrets: ${{ needs.detect-secrets.result }}"
          echo ""
          
          if [[ "${{ needs.secret-scan.result }}" == "success" ]] && \
             [[ "${{ needs.trufflehog-scan.result }}" == "success" ]] && \
             [[ "${{ needs.detect-secrets.result }}" == "success" ]]; then
            echo "🎉 ALL SECRET SCANS PASSED"
            echo "High-confidence exposures: 0"
            exit 0
          else
            echo "❌ SECRET SCANS FAILED"
            exit 1
          fi