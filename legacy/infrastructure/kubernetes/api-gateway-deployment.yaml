apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: certivo
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: certivo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: certivo/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: VERIFICATION_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: certivo-config
              key: VERIFICATION_SERVICE_URL
        - name: CHALLENGE_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: certivo-config
              key: CHALLENGE_SERVICE_URL
        - name: RISK_SCORING_URL
          valueFrom:
            configMapKeyRef:
              name: certivo-config
              key: RISK_SCORING_URL
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: REDIS_PASSWORD
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379"
        - name: INTERNAL_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: certivo-secrets
              key: INTERNAL_AUTH_TOKEN
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: certivo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max