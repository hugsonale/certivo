# Network isolation for admin service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-service-isolation
  namespace: certivo
spec:
  podSelector:
    matchLabels:
      app: admin-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 10.0.0.0/8  # Internal network only
    ports:
    - protocol: TCP
      port: 8005

---

# Allow internal service communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-services
  namespace: certivo
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}