# Certivo secret-scanning rules (gitleaks v8.30.x).
# Extends the built-in rules and adds Certivo's own credential formats.
# Deliberately NO allowlist for *.md, *.txt or test files: a secret in a document is still a leak.

title = "Certivo gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "certivo-partner-api-key"
description = "Certivo partner API key (cvk_...)"
regex = '''cvk_[A-Za-z0-9_-]{43}'''
keywords = ["cvk_"]

[[rules]]
id = "certivo-sdk-session-token"
description = "Certivo SDK session token (skt_...)"
regex = '''skt_[A-Za-z0-9_-]{43}'''
keywords = ["skt_"]

[[rules]]
id = "certivo-attestation-signing-key"
description = "Value assigned to CERTIVO_ATTESTATION_SIGNING_KEY"
regex = '''(?i)CERTIVO_ATTESTATION_SIGNING_KEY\s*[:=]\s*['"]?[A-Za-z0-9_-]{43}['"]?'''
keywords = ["certivo_attestation_signing_key"]

# --- Reviewed false positives (keep this list short and specific) ---

# The old prototype is frozen reference code. Only the noisy "generic key" rule is
# silenced there; every other rule (private keys, cloud keys, Certivo keys) still applies.
[[allowlists]]
description = "legacy/ reference code: generic-api-key false positives only"
paths = ['''^legacy/''']
targetRules = ["generic-api-key"]

# A Python type annotation, not a secret value.
[[allowlists]]
description = "private_key: Ed25519PrivateKey is a type annotation"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''private_key:\s*Ed25519PrivateKey\s*$''']
