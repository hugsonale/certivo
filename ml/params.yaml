# Every number that shapes an experiment lives here, so a change shows up in git and in the experiment record.
synthetic:
  # The data is generated by this repository, not collected from people. It exists only to test the ML workspace.
  seed: 20261105
  samples: 2400
  side: 16
  # A made-up "device" label with a different amount of noise for each value, so per-group reporting has something to report.
  group_noise: [10, 20, 40]
  stamp_amplitude: 8
  split: { train: 0.6, val: 0.2, test: 0.2 }

baseline:
  # How soft the probabilities are. The training step picks the best one on the validation split.
  temperature_grid: [1, 2, 5, 10, 20, 50, 100, 200, 500]
  threshold: 0.5
