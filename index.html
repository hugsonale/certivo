<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certivo Prime Verification</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    text-align: center;
    padding: 20px;
}

#cameraWrapper {
    position: relative;
    display: inline-block;
}

video {
    width: 320px;
    border-radius: 12px;
    margin-top: 10px;
}

#overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    font-size: 64px;
    font-weight: bold;
    color: #facc15;
}

button {
    margin-top: 15px;
    padding: 10px 22px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    background: #3b82f6;
    color: #fff;
    transition: all 0.3s ease;
}

button:hover:not(:disabled) {
    background: #2563eb;
    transform: translateY(-2px);
}

button:disabled {
    background: #64748b;
    cursor: not-allowed;
    transform: none;
}

#status, #faceStatus, #challengeProgress, #challengeTimer {
    margin-top: 15px;
    font-weight: bold;
    min-height: 24px;
    transition: color 0.3s ease;
}

#verdictScreen {
    display: none;
    margin-top: 25px;
}

#trustBarOuter {
    width: 320px;
    margin: 0 auto;
    background: #1e293b;
    border-radius: 12px;
    overflow: hidden;
}

#trustBar {
    height: 18px;
    width: 0%;
    transition: width 0.8s ease;
}

/* Fast-Track Badge Styles */
#fastTrackBadge {
    display: none;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    margin: 15px auto;
    max-width: 320px;
    font-weight: bold;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    animation: slideIn 0.5s ease;
}

.fast-track-icon {
    font-size: 24px;
    margin-right: 8px;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}
</style>

</head>

<body>

<h1>Certivo Prime Verification</h1>

<!-- Fast-Track Badge -->
<div id="fastTrackBadge">
    <span class="fast-track-icon">🚀</span>
    <span id="fastTrackText">Fast-Track Mode Active</span>
</div>

<div id="cameraWrapper">
    <video id="video" autoplay muted></video>
    <div id="overlay"></div>
</div>

<button id="startFaceBtn">Start Face Verification</button>

<div id="faceSection" style="display:none;">
    <p id="faceStatus">📷 Please show your face clearly</p>
    <button id="proceedBtn" disabled>Proceed to Challenge</button>
</div>

<div id="challengeSection" style="display:none;">
    <p id="challengeProgress"></p>
    <p id="status"></p>
    <p id="challengeTimer"></p>
</div>

<div id="verdictScreen">
    <h2>✅ HUMAN VERIFIED</h2>
    <p>Trust Confidence</p>
    <div id="trustBarOuter"><div id="trustBar"></div></div>
    <p id="trustLabel" style="margin-top:10px;font-weight:bold;"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/facemesh"></script>

<script>
// ============================================================================
// BOT DETECTION SYSTEM - 10/10
// ============================================================================

const BotDetector = {
    checks: {},
    
    // Check 1: WebDriver detection
    checkWebDriver() {
        this.checks.webdriver = navigator.webdriver === true;
        return this.checks.webdriver;
    },
    
    // Check 2: Headless browser detection
    checkHeadless() {
        const checks = {
            userAgent: /HeadlessChrome|PhantomJS|Nightmare/i.test(navigator.userAgent),
            noPlugins: navigator.plugins.length === 0,
            noLanguages: navigator.languages.length === 0,
            chromeRuntime: !window.chrome && /Chrome/.test(navigator.userAgent),
            permissions: navigator.permissions === undefined,
            // Chrome DevTools detection
            devtools: window.outerWidth - window.innerWidth > 160 ||
                     window.outerHeight - window.innerHeight > 160
        };
        
        this.checks.headless = Object.values(checks).filter(v => v).length >= 2;
        this.checks.headlessDetails = checks;
        return this.checks.headless;
    },
    
    // Check 3: Automation framework detection
    checkAutomation() {
        const checks = {
            // Selenium
            selenium: window.document.$cdc_asdjflasutopfhvcZLmcfl_ !== undefined ||
                     window.document.documentElement.getAttribute('selenium') !== null ||
                     window.document.documentElement.getAttribute('webdriver') !== null ||
                     window.document.documentElement.getAttribute('driver') !== null,
            
            // Puppeteer
            puppeteer: window.navigator.webdriver ||
                      window.callPhantom !== undefined ||
                      window._phantom !== undefined,
            
            // Nightmare
            nightmare: window.__nightmare !== undefined,
            
            // Generic automation properties
            domAutomation: window.domAutomation !== undefined ||
                          window.domAutomationController !== undefined
        };
        
        this.checks.automation = Object.values(checks).some(v => v);
        this.checks.automationDetails = checks;
        return this.checks.automation;
    },
    
    // Check 4: Browser features consistency
    checkBrowserConsistency() {
        const issues = [];
        
        // Chrome without chrome object
        if (/Chrome/.test(navigator.userAgent) && !window.chrome) {
            issues.push('chrome_missing');
        }
        
        // Missing expected properties
        if (!navigator.platform) issues.push('no_platform');
        if (!navigator.hardwareConcurrency) issues.push('no_hardware');
        if (!screen.colorDepth) issues.push('no_color_depth');
        
        // Suspicious screen dimensions
        if (screen.width < 100 || screen.height < 100) {
            issues.push('tiny_screen');
        }
        
        // Missing Date.prototype.toJSON
        if (typeof Date.prototype.toJSON !== 'function') {
            issues.push('missing_date_json');
        }
        
        this.checks.inconsistencies = issues;
        return issues.length > 0;
    },
    
    // Check 5: Mouse/Touch interaction
    checkHumanInteraction() {
        return new Promise((resolve) => {
            let hasMouseMove = false;
            let hasClick = false;
            let hasTouch = false;
            
            const timeout = setTimeout(() => {
                this.checks.humanInteraction = hasMouseMove || hasClick || hasTouch;
                this.checks.interactionDetails = {
                    mouseMove: hasMouseMove,
                    click: hasClick,
                    touch: hasTouch
                };
                cleanup();
                resolve(this.checks.humanInteraction);
            }, 3000); // Wait 3 seconds for interaction
            
            const onMouseMove = () => { hasMouseMove = true; };
            const onClick = () => { hasClick = true; };
            const onTouch = () => { hasTouch = true; };
            
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('click', onClick);
            document.addEventListener('touchstart', onTouch);
            
            const cleanup = () => {
                clearTimeout(timeout);
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('click', onClick);
                document.removeEventListener('touchstart', onTouch);
            };
        });
    },
    
    // Check 6: Canvas fingerprinting
    checkCanvas() {
        try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            if (!ctx) {
                this.checks.canvasBlocked = true;
                return true;
            }
            
            // Draw test pattern
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.textBaseline = 'alphabetic';
            ctx.fillStyle = '#f60';
            ctx.fillRect(125, 1, 62, 20);
            ctx.fillStyle = '#069';
            ctx.fillText('BotCheck', 2, 15);
            ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
            ctx.fillText('BotCheck', 4, 17);
            
            const dataUrl = canvas.toDataURL();
            
            // Check if canvas is blank (some bots return blank canvas)
            this.checks.canvasBlank = dataUrl === 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
            this.checks.canvasFingerprint = dataUrl.slice(-20); // Store last 20 chars
            
            return this.checks.canvasBlank;
        } catch (e) {
            this.checks.canvasError = true;
            return true;
        }
    },
    
    // Check 7: WebGL fingerprinting
    checkWebGL() {
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            
            if (!gl) {
                this.checks.webglBlocked = true;
                return true;
            }
            
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            if (debugInfo) {
                this.checks.webglVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                this.checks.webglRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                
                // Check for suspicious values
                const suspicious = /SwiftShader|llvmpipe|Microsoft Basic Render/i.test(
                    this.checks.webglRenderer
                );
                this.checks.webglSuspicious = suspicious;
                return suspicious;
            }
            
            return false;
        } catch (e) {
            this.checks.webglError = true;
            return true;
        }
    },
    
    // Check 8: Timing attacks (bots often have inconsistent timing)
    async checkTimingConsistency() {
        const delays = [];
        
        for (let i = 0; i < 5; i++) {
            const start = performance.now();
            await new Promise(resolve => setTimeout(resolve, 100));
            const end = performance.now();
            delays.push(end - start);
        }
        
        // Calculate variance
        const avg = delays.reduce((a, b) => a + b) / delays.length;
        const variance = delays.reduce((sum, delay) => sum + Math.pow(delay - avg, 2), 0) / delays.length;
        
        // Bots often have very low variance (too consistent) or very high variance
        this.checks.timingVariance = variance;
        this.checks.timingInconsistent = variance < 1 || variance > 1000;
        
        return this.checks.timingInconsistent;
    },
    
    // Check 9: Browser window properties
    checkWindowProperties() {
        const issues = [];
        
        // Phantom detection
        if (window.callPhantom || window._phantom) {
            issues.push('phantom_detected');
        }
        
        // Check for common bot properties
        const botProps = [
            '__webdriver_evaluate', '__selenium_evaluate',
            '__webdriver_script_function', '__webdriver_script_func',
            '__webdriver_script_fn', '__fxdriver_evaluate',
            '__driver_unwrapped', '__webdriver_unwrapped',
            '__driver_evaluate', '__selenium_unwrapped',
            '__fxdriver_unwrapped'
        ];
        
        botProps.forEach(prop => {
            if (window[prop]) issues.push(`bot_prop_${prop}`);
        });
        
        this.checks.windowIssues = issues;
        return issues.length > 0;
    },
    
    // Check 10: Media device availability
    async checkMediaDevices() {
        try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                this.checks.noMediaDevices = true;
                return true;
            }
            
            const devices = await navigator.mediaDevices.enumerateDevices();
            const cameras = devices.filter(d => d.kind === 'videoinput');
            
            // Bots often have no cameras or fake cameras
            this.checks.cameraCount = cameras.length;
            this.checks.noCameras = cameras.length === 0;
            
            // Check for suspicious labels
            const suspiciousLabels = cameras.some(c => 
                !c.label || c.label === '' || /fake|virtual|obs/i.test(c.label)
            );
            this.checks.suspiciousCameraLabels = suspiciousLabels;
            
            return this.checks.noCameras || suspiciousLabels;
        } catch (e) {
            this.checks.mediaDeviceError = true;
            return true;
        }
    },
    
    // Master detection function
    async runAllChecks() {
        console.log("🔍 Running bot detection checks...");
        
        // Synchronous checks
        this.checkWebDriver();
        this.checkHeadless();
        this.checkAutomation();
        this.checkBrowserConsistency();
        this.checkCanvas();
        this.checkWebGL();
        this.checkWindowProperties();
        
        // Asynchronous checks
        await this.checkTimingConsistency();
        await this.checkMediaDevices();
        // Note: checkHumanInteraction is optional, run separately if needed
        
        // Calculate suspicion score
        const suspicionPoints = [
            this.checks.webdriver ? 3 : 0,
            this.checks.headless ? 3 : 0,
            this.checks.automation ? 5 : 0,
            this.checks.inconsistencies?.length > 0 ? 2 : 0,
            this.checks.canvasBlocked || this.checks.canvasBlank ? 2 : 0,
            this.checks.webglBlocked || this.checks.webglSuspicious ? 2 : 0,
            this.checks.windowIssues?.length > 0 ? 3 : 0,
            this.checks.timingInconsistent ? 1 : 0,
            this.checks.noCameras ? 2 : 0,
            this.checks.suspiciousCameraLabels ? 1 : 0
        ];
        
        this.suspicionScore = suspicionPoints.reduce((a, b) => a + b, 0);
        this.isLikelyBot = this.suspicionScore >= 5;
        
        console.log("🤖 Bot detection results:", {
            suspicionScore: this.suspicionScore,
            isLikelyBot: this.isLikelyBot,
            checks: this.checks
        });
        
        return {
            isBot: this.isLikelyBot,
            score: this.suspicionScore,
            checks: this.checks
        };
    },
    
    // Get fingerprint for backend
    getFingerprint() {
        return {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            languages: navigator.languages,
            hardwareConcurrency: navigator.hardwareConcurrency,
            deviceMemory: navigator.deviceMemory,
            screenResolution: `${screen.width}x${screen.height}`,
            colorDepth: screen.colorDepth,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            timezoneOffset: new Date().getTimezoneOffset(),
            canvasFingerprint: this.checks.canvasFingerprint,
            webglVendor: this.checks.webglVendor,
            webglRenderer: this.checks.webglRenderer,
            cookieEnabled: navigator.cookieEnabled,
            doNotTrack: navigator.doNotTrack,
            plugins: Array.from(navigator.plugins || []).map(p => p.name).slice(0, 5)
        };
    }
};
</script>


<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const startFaceBtn = document.getElementById("startFaceBtn");
const faceSection = document.getElementById("faceSection");
const proceedBtn = document.getElementById("proceedBtn");
const challengeSection = document.getElementById("challengeSection");
const statusEl = document.getElementById("status");
const challengeProgress = document.getElementById("challengeProgress");
const challengeTimer = document.getElementById("challengeTimer");
const verdictScreen = document.getElementById("verdictScreen");
const trustBar = document.getElementById("trustBar");
const trustLabel = document.getElementById("trustLabel");

let faceModel;
let challenges = [];
let challengeIndex = 0;
let sessionResults = [];
let mediaRecorder;
let recordedChunks = [];

let activeInstruction = "";
let initialNoseX = null;
let movementDetected = false;
let movementInterval = null;
let countdownInterval = null;

let faceVerificationTimeout = null;
const FACE_VERIFICATION_TIMEOUT = 30000; // 30 seconds

const deviceId = "device_" + Math.floor(Math.random() * 100000);

/* Overlay */
function showOverlayForInstruction(text) {
    overlay.innerHTML = "";
    const t = text.toLowerCase();
    if (t.includes("left")) overlay.innerHTML = "⬅️";
    else if (t.includes("right")) overlay.innerHTML = "➡️";
}

/* Enhanced Face Verification with Bot Detection - 10/10 */
startFaceBtn.onclick = async () => {
    // RUN BOT DETECTION FIRST
    startFaceBtn.disabled = true;
    startFaceBtn.innerText = "🔍 Checking browser...";
    
    try {
        const botResult = await BotDetector.runAllChecks();
        
        if (botResult.isBot) {
            alert("⚠️ Automated browser detected. Please use a standard browser for verification.");
            console.error("Bot detection failed:", botResult);
            
            // Log to backend
            await fetch(`http://127.0.0.1:8000/v1/bot-report`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    device_id: deviceId,
                    bot_detected: true,
                    suspicion_score: botResult.score,
                    checks: botResult.checks,
                    fingerprint: BotDetector.getFingerprint()
                })
            });
            
            startFaceBtn.innerText = "Start Face Verification";
            startFaceBtn.disabled = false;
            return;
        }
        
        console.log("✅ Bot detection passed");
        
    } catch (error) {
        console.error("Bot detection error:", error);
        // Continue anyway if bot detection fails (fail-open for user experience)
    }
    
    // Continue with original face verification code
    startFaceBtn.style.display = "none";
    faceSection.style.display = "block";
    
    try {
        // Request camera access with error handling
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                width: { ideal: 640 },
                height: { ideal: 480 },
                facingMode: "user"
            } 
        });
        video.srcObject = stream;
        
        // Load face detection model with error handling
        try {
            document.getElementById("faceStatus").innerText = "🔄 Loading face detection...";
            faceModel = await facemesh.load();
            document.getElementById("faceStatus").innerText = "📷 Please show your face clearly";
            startFaceDetectionLoop();
        } catch (modelError) {
            console.error("Face model loading failed:", modelError);
            document.getElementById("faceStatus").innerText = "❌ Failed to load face detection. Please refresh.";
            document.getElementById("faceStatus").style.color = "#ef4444";
        }
        
    } catch (error) {
        console.error("Camera access error:", error);
        let errorMessage = "❌ Camera access denied. ";
        
        if (error.name === "NotAllowedError") {
            errorMessage += "Please allow camera permissions and refresh.";
        } else if (error.name === "NotFoundError") {
            errorMessage += "No camera found on this device.";
        } else if (error.name === "NotReadableError") {
            errorMessage += "Camera is already in use by another application.";
        } else {
            errorMessage += "Please check camera permissions.";
        }
        
        document.getElementById("faceStatus").innerText = errorMessage;
        document.getElementById("faceStatus").style.color = "#ef4444";
        startFaceBtn.style.display = "block";
        faceSection.style.display = "none";
    }
};

function startFaceDetectionLoop() {
    let attemptCount = 0;
    const maxAttempts = 75; // 30 seconds at 400ms intervals
    
    // Set timeout as backup
    faceVerificationTimeout = setTimeout(() => {
        clearInterval(detectionInterval);
        document.getElementById("faceStatus").innerText = "⏱️ Timeout: No face detected. Please try again.";
        document.getElementById("faceStatus").style.color = "#f59e0b";
        
        // Show retry button
        const retryBtn = document.createElement("button");
        retryBtn.innerText = "Retry Face Detection";
        retryBtn.onclick = () => {
            retryBtn.remove();
            document.getElementById("faceStatus").style.color = "#e5e7eb";
            document.getElementById("faceStatus").innerText = "📷 Please show your face clearly";
            attemptCount = 0;
            startFaceDetectionLoop();
        };
        faceSection.appendChild(retryBtn);
    }, FACE_VERIFICATION_TIMEOUT);
    
    const detectionInterval = setInterval(async () => {
        attemptCount++;
        
        try {
            const preds = await faceModel.estimateFaces(video);
            
            if (preds.length === 0) {
                // No face detected
                if (attemptCount % 5 === 0) { // Update every 2 seconds
                    document.getElementById("faceStatus").innerText = "👤 No face detected. Please center your face.";
                }
            } else if (preds.length > 1) {
                // Multiple faces detected
                document.getElementById("faceStatus").innerText = "⚠️ Multiple faces detected. Please ensure only you are visible.";
            } else if (preds.length === 1) {
                // Perfect: exactly one face
                clearInterval(detectionInterval);
                clearTimeout(faceVerificationTimeout);
                
                proceedBtn.disabled = false;
                document.getElementById("faceStatus").innerText = "✅ Face verified successfully";
                document.getElementById("faceStatus").style.color = "#10b981";
                
                // Optional: Add success animation
                proceedBtn.style.animation = "pulse 1s ease-in-out";
            }
            
            // Stop after max attempts
            if (attemptCount >= maxAttempts) {
                clearInterval(detectionInterval);
                clearTimeout(faceVerificationTimeout);
            }
            
        } catch (error) {
            console.error("Face detection error:", error);
            clearInterval(detectionInterval);
            clearTimeout(faceVerificationTimeout);
            document.getElementById("faceStatus").innerText = "❌ Face detection failed. Please refresh.";
            document.getElementById("faceStatus").style.color = "#ef4444";
        }
    }, 400);
}

/* Load challenges with Fast-Track support and token storage */
proceedBtn.onclick = async () => {
    faceSection.style.display = "none";
    challengeSection.style.display = "block";

    try {
        console.log("🔍 Fetching challenges for device:", deviceId);
        
        const res = await fetch(`http://127.0.0.1:8000/v1/challenge?device_id=${deviceId}`);
        const data = await res.json();
        
        console.log("📦 Response data:", data);
        
        // Show fast-track badge if enabled
        if (data.fast_track_enabled) {
            const badge = document.getElementById("fastTrackBadge");
            badge.style.display = "block";
            document.getElementById("fastTrackText").innerText = data.message;
            console.log("🚀 Fast-Track Mode:", data.challenges.length, "challenge(s)");
        }
        
        // STORE CHALLENGES WITH TOKEN_ID
        challenges = data.challenges.map(ch => ({
            challenge_id: ch.challenge_id,
            token_id: ch.token_id,
            instruction: ch.instruction,
            difficulty: ch.difficulty || "medium",
            fast_track: ch.fast_track || false
        }));
        
        console.log("✅ Challenges loaded:", challenges);
        
        // Initialize and start first challenge
        challengeIndex = 0;
        sessionResults = [];
        loadNextChallenge();
        
    } catch (error) {
        console.error("❌ Error loading challenges:", error);
        statusEl.innerText = "❌ Error loading challenges. Check console.";
        statusEl.style.color = "#ef4444";
    }
};

function loadNextChallenge() {
    clearInterval(countdownInterval);

    if (challengeIndex >= challenges.length) {
        finalizeSession();
        return;
    }

    const ch = challenges[challengeIndex++];
    
    // Show fast-track indicator in challenge progress
    const fastTrackLabel = ch.fast_track ? " 🚀" : "";
    challengeProgress.innerText = `Challenge ${challengeIndex} of ${challenges.length}${fastTrackLabel}`;
    
    statusEl.innerText = ch.instruction;
    statusEl.style.color = "#e5e7eb";

    activeInstruction = ch.instruction.toLowerCase();
    initialNoseX = null;
    movementDetected = false;

    showOverlayForInstruction(ch.instruction);
    
    // Fast-track gets shorter time (8s vs 12s)
    const duration = ch.fast_track ? 8 : 12;
    startRecording(ch.challenge_id, ch.token_id, duration);
}

/* Head movement detection */
async function trackHeadMovement() {
    const preds = await faceModel.estimateFaces(video);
    if (!preds.length) return;

    const noseX = preds[0].scaledMesh[1][0];

    if (initialNoseX === null) {
        initialNoseX = noseX;
        console.log("Initial nose X set to:", initialNoseX.toFixed(2));
        return;
    }

    const delta = noseX - initialNoseX;

    // NOTE: webcam is mirrored
    if (activeInstruction.includes("left") && delta > 8) {
        movementDetected = true;
    }

    if (activeInstruction.includes("right") && delta < -8) {
        movementDetected = true;
    }

    console.log(
        "Instruction:", activeInstruction,
        "| NoseX:", noseX.toFixed(2),
        "| Delta:", delta.toFixed(2),
        "| MovementDetected:", movementDetected
    );
}

/* Recording with token_id */
function startRecording(challengeId, tokenId, duration) {
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(video.srcObject);

    mediaRecorder.ondataavailable = e => e.data.size && recordedChunks.push(e.data);

    mediaRecorder.onstop = async () => {
        clearInterval(movementInterval);
        overlay.innerHTML = "";

        const requiresMovement =
            activeInstruction.includes("left") ||
            activeInstruction.includes("right");

        if (requiresMovement && !movementDetected) {
            statusEl.innerText = "❌ No movement detected";
            sessionResults.push({ challenge_passed: false });
            setTimeout(loadNextChallenge, 800);
            return;
        }

        await submitRecording(challengeId, tokenId);
    };

    mediaRecorder.start();
    movementInterval = setInterval(trackHeadMovement, 250);
    setTimeout(() => mediaRecorder.stop(), duration * 1000);

    let t = duration;
    challengeTimer.innerText = `Time left: ${t}s`;
    countdownInterval = setInterval(() => {
        t--;
        challengeTimer.innerText = `Time left: ${t}s`;
        if (t <= 0) clearInterval(countdownInterval);
    }, 1000);
}

/* Submit with token_id - 10/10 SECURITY */
async function submitRecording(challengeId, tokenId) {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const formData = new FormData();
    formData.append("video", blob);
    formData.append("challenge_id", challengeId);
    formData.append("token_id", tokenId);
    formData.append("device_id", deviceId);

    console.log("📤 Submitting challenge:", challengeId.substring(0, 8) + "...");
    console.log("🔑 Token:", tokenId.substring(0, 8) + "...");

    const res = await fetch("http://127.0.0.1:8000/v1/verify", {
        method: "POST",
        body: formData
    });

    const result = await res.json();
    
    // Check for token validation errors
    if (result.error && result.error.includes("token")) {
        console.error("🔒 Token validation failed:", result.error);
        statusEl.innerText = "🔒 Security validation failed";
        statusEl.style.color = "#ef4444";
    } else {
        statusEl.innerText = result.challenge_passed ? "✅ Passed" : "❌ Failed";
        statusEl.style.color = result.challenge_passed ? "#10b981" : "#ef4444";
    }
    
    sessionResults.push(result);
    setTimeout(loadNextChallenge, 700);
}

/* Finalize */
async function finalizeSession() {
    statusEl.innerText = "🔐 Calculating trust score...";
    statusEl.style.color = "#e5e7eb";
    
    const res = await fetch("http://127.0.0.1:8000/v1/finalize", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ results: sessionResults, device_id: deviceId })
    });
    
    const final = await res.json();
    
    verdictScreen.style.display = "block";
    trustBar.style.width = final.trust_score + "%";
    trustLabel.innerText = `${final.trust_level.toUpperCase()} TRUST`;
    
    // Color the trust bar based on level
    if (final.trust_level === "high") {
        trustBar.style.background = "#10b981";
    } else if (final.trust_level === "medium") {
        trustBar.style.background = "#f59e0b";
    } else {
        trustBar.style.background = "#ef4444";
    }
    
    console.log("✅ Verification complete:", final);
}
