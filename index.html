<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certivo Prime Verification</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    text-align: center;
    padding: 20px;
}

#cameraWrapper {
    position: relative;
    display: inline-block;
}

video {
    width: 320px;
    border-radius: 12px;
    margin-top: 10px;
}

#overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    font-size: 64px;
    font-weight: bold;
    color: #facc15;
}

button {
    margin-top: 15px;
    padding: 10px 22px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    background: #3b82f6;
    color: #fff;
    transition: all 0.3s ease;
}

button:hover:not(:disabled) {
    background: #2563eb;
    transform: translateY(-2px);
}

button:disabled {
    background: #64748b;
    cursor: not-allowed;
    transform: none;
}

#status, #faceStatus, #challengeProgress, #challengeTimer {
    margin-top: 15px;
    font-weight: bold;
    min-height: 24px;
    transition: color 0.3s ease;
}

#verdictScreen {
    display: none;
    margin-top: 25px;
}

#trustBarOuter {
    width: 320px;
    margin: 0 auto;
    background: #1e293b;
    border-radius: 12px;
    overflow: hidden;
}

#trustBar {
    height: 18px;
    width: 0%;
    transition: width 0.8s ease;
}

/* Fast-Track Badge Styles */
#fastTrackBadge {
    display: none;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    margin: 15px auto;
    max-width: 320px;
    font-weight: bold;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    animation: slideIn 0.5s ease;
}

.fast-track-icon {
    font-size: 24px;
    margin-right: 8px;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}
</style>

</head>

<body>

<h1>Certivo Prime Verification</h1>

<!-- Fast-Track Badge -->
<div id="fastTrackBadge">
    <span class="fast-track-icon">🚀</span>
    <span id="fastTrackText">Fast-Track Mode Active</span>
</div>

<div id="cameraWrapper">
    <video id="video" autoplay muted></video>
    <div id="overlay"></div>
</div>

<button id="startFaceBtn">Start Face Verification</button>

<div id="faceSection" style="display:none;">
    <p id="faceStatus">📷 Please show your face clearly</p>
    <button id="proceedBtn" disabled>Proceed to Challenge</button>
</div>

<div id="challengeSection" style="display:none;">
    <p id="challengeProgress"></p>
    <p id="status"></p>
    <p id="challengeTimer"></p>
</div>

<div id="verdictScreen">
    <h2>✅ HUMAN VERIFIED</h2>
    <p>Trust Confidence</p>
    <div id="trustBarOuter"><div id="trustBar"></div></div>
    <p id="trustLabel" style="margin-top:10px;font-weight:bold;"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/facemesh"></script>

<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const startFaceBtn = document.getElementById("startFaceBtn");
const faceSection = document.getElementById("faceSection");
const proceedBtn = document.getElementById("proceedBtn");
const challengeSection = document.getElementById("challengeSection");
const statusEl = document.getElementById("status");
const challengeProgress = document.getElementById("challengeProgress");
const challengeTimer = document.getElementById("challengeTimer");
const verdictScreen = document.getElementById("verdictScreen");
const trustBar = document.getElementById("trustBar");
const trustLabel = document.getElementById("trustLabel");

let faceModel;
let challenges = [];
let challengeIndex = 0;
let sessionResults = [];
let mediaRecorder;
let recordedChunks = [];

let activeInstruction = "";
let initialNoseX = null;
let movementDetected = false;
let movementInterval = null;
let countdownInterval = null;

let faceVerificationTimeout = null;
const FACE_VERIFICATION_TIMEOUT = 30000; // 30 seconds

const deviceId = "device_" + Math.floor(Math.random() * 100000);

/* Overlay */
function showOverlayForInstruction(text) {
    overlay.innerHTML = "";
    const t = text.toLowerCase();
    if (t.includes("left")) overlay.innerHTML = "⬅️";
    else if (t.includes("right")) overlay.innerHTML = "➡️";
}

/* Enhanced Face Verification - 10/10 */
startFaceBtn.onclick = async () => {
    startFaceBtn.style.display = "none";
    faceSection.style.display = "block";
    
    try {
        // Request camera access with error handling
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                width: { ideal: 640 },
                height: { ideal: 480 },
                facingMode: "user"
            } 
        });
        video.srcObject = stream;
        
        // Load face detection model with error handling
        try {
            document.getElementById("faceStatus").innerText = "🔄 Loading face detection...";
            faceModel = await facemesh.load();
            document.getElementById("faceStatus").innerText = "📷 Please show your face clearly";
            startFaceDetectionLoop();
        } catch (modelError) {
            console.error("Face model loading failed:", modelError);
            document.getElementById("faceStatus").innerText = "❌ Failed to load face detection. Please refresh.";
            document.getElementById("faceStatus").style.color = "#ef4444";
        }
        
    } catch (error) {
        console.error("Camera access error:", error);
        let errorMessage = "❌ Camera access denied. ";
        
        if (error.name === "NotAllowedError") {
            errorMessage += "Please allow camera permissions and refresh.";
        } else if (error.name === "NotFoundError") {
            errorMessage += "No camera found on this device.";
        } else if (error.name === "NotReadableError") {
            errorMessage += "Camera is already in use by another application.";
        } else {
            errorMessage += "Please check camera permissions.";
        }
        
        document.getElementById("faceStatus").innerText = errorMessage;
        document.getElementById("faceStatus").style.color = "#ef4444";
        startFaceBtn.style.display = "block";
        faceSection.style.display = "none";
    }
};

function startFaceDetectionLoop() {
    let attemptCount = 0;
    const maxAttempts = 75; // 30 seconds at 400ms intervals
    
    // Set timeout as backup
    faceVerificationTimeout = setTimeout(() => {
        clearInterval(detectionInterval);
        document.getElementById("faceStatus").innerText = "⏱️ Timeout: No face detected. Please try again.";
        document.getElementById("faceStatus").style.color = "#f59e0b";
        
        // Show retry button
        const retryBtn = document.createElement("button");
        retryBtn.innerText = "Retry Face Detection";
        retryBtn.onclick = () => {
            retryBtn.remove();
            document.getElementById("faceStatus").style.color = "#e5e7eb";
            document.getElementById("faceStatus").innerText = "📷 Please show your face clearly";
            attemptCount = 0;
            startFaceDetectionLoop();
        };
        faceSection.appendChild(retryBtn);
    }, FACE_VERIFICATION_TIMEOUT);
    
    const detectionInterval = setInterval(async () => {
        attemptCount++;
        
        try {
            const preds = await faceModel.estimateFaces(video);
            
            if (preds.length === 0) {
                // No face detected
                if (attemptCount % 5 === 0) { // Update every 2 seconds
                    document.getElementById("faceStatus").innerText = "👤 No face detected. Please center your face.";
                }
            } else if (preds.length > 1) {
                // Multiple faces detected
                document.getElementById("faceStatus").innerText = "⚠️ Multiple faces detected. Please ensure only you are visible.";
            } else if (preds.length === 1) {
                // Perfect: exactly one face
                clearInterval(detectionInterval);
                clearTimeout(faceVerificationTimeout);
                
                proceedBtn.disabled = false;
                document.getElementById("faceStatus").innerText = "✅ Face verified successfully";
                document.getElementById("faceStatus").style.color = "#10b981";
                
                // Optional: Add success animation
                proceedBtn.style.animation = "pulse 1s ease-in-out";
            }
            
            // Stop after max attempts
            if (attemptCount >= maxAttempts) {
                clearInterval(detectionInterval);
                clearTimeout(faceVerificationTimeout);
            }
            
        } catch (error) {
            console.error("Face detection error:", error);
            clearInterval(detectionInterval);
            clearTimeout(faceVerificationTimeout);
            document.getElementById("faceStatus").innerText = "❌ Face detection failed. Please refresh.";
            document.getElementById("faceStatus").style.color = "#ef4444";
        }
    }, 400);
}

/* Load challenges with Fast-Track support */
proceedBtn.onclick = async () => {
    faceSection.style.display = "none";
    challengeSection.style.display = "block";

    const res = await fetch(`http://127.0.0.1:8000/v1/challenge?device_id=${deviceId}`);
    const data = await res.json();
    
    // Show fast-track badge if enabled
    if (data.fast_track_enabled) {
        const badge = document.getElementById("fastTrackBadge");
        badge.style.display = "block";
        document.getElementById("fastTrackText").innerText = data.message;
        console.log("🚀 Fast-Track Mode:", data.challenges.length, "challenge(s)");
    }
    
    // STORE CHALLENGES WITH TOKEN_ID
    challenges = data.challenges.map(ch => ({
        challenge_id: ch.challenge_id,
        token_id: ch.token_id,
        instruction: ch.instruction,
        difficulty: ch.difficulty,
        fast_track: ch.fast_track
    }));
};

function loadNextChallenge() {
    clearInterval(countdownInterval);

    if (challengeIndex >= challenges.length) {
        finalizeSession();
        return;
    }

    const ch = challenges[challengeIndex++];
    
    // Show fast-track indicator in challenge progress
    const fastTrackLabel = ch.fast_track ? " 🚀" : "";
    challengeProgress.innerText = `Challenge ${challengeIndex} of ${challenges.length}${fastTrackLabel}`;
    
    statusEl.innerText = ch.instruction;

    activeInstruction = ch.instruction.toLowerCase();
    initialNoseX = null;
    movementDetected = false;

    showOverlayForInstruction(ch.instruction);
    
    // Fast-track gets shorter time (8s vs 12s)
    const duration = ch.fast_track ? 8 : 12;
    startRecording(ch.challenge_id, ch.token_id, duration);
}

/* Head movement detection */
async function trackHeadMovement() {
    const preds = await faceModel.estimateFaces(video);
    if (!preds.length) return;

    const noseX = preds[0].scaledMesh[1][0];

    if (initialNoseX === null) {
        initialNoseX = noseX;
        console.log("Initial nose X set to:", initialNoseX.toFixed(2));
        return;
    }

    const delta = noseX - initialNoseX;

    // NOTE: webcam is mirrored
    if (activeInstruction.includes("left") && delta > 8) {
        movementDetected = true;
    }

    if (activeInstruction.includes("right") && delta < -8) {
        movementDetected = true;
    }

    console.log(
        "Instruction:", activeInstruction,
        "| NoseX:", noseX.toFixed(2),
        "| Delta:", delta.toFixed(2),
        "| MovementDetected:", movementDetected
    );
}

/* Recording */
function startRecording(challengeId, tokenId, duration) {
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(video.srcObject);

    mediaRecorder.ondataavailable = e => e.data.size && recordedChunks.push(e.data);

    mediaRecorder.onstop = async () => {
        clearInterval(movementInterval);
        overlay.innerHTML = "";

        const requiresMovement =
            activeInstruction.includes("left") ||
            activeInstruction.includes("right");

        if (requiresMovement && !movementDetected) {
            statusEl.innerText = "❌ No movement detected";
            sessionResults.push({ challenge_passed: false });
            setTimeout(loadNextChallenge, 800);
            return;
        }

        await submitRecording(challengeId, tokenId);
    };

    mediaRecorder.start();
    movementInterval = setInterval(trackHeadMovement, 250);
    setTimeout(() => mediaRecorder.stop(), duration * 1000);

    let t = duration;
    challengeTimer.innerText = `Time left: ${t}s`;
    countdownInterval = setInterval(() => {
        t--;
        challengeTimer.innerText = `Time left: ${t}s`;
        if (t <= 0) clearInterval(countdownInterval);
    }, 1000);
}

/* Submit */
async function submitRecording(challengeId) {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const formData = new FormData();
    formData.append("video", blob);
    formData.append("challenge_id", challengeId);
    formData.append("device_id", deviceId);

    const res = await fetch("http://127.0.0.1:8000/v1/verify", {
        method: "POST",
        body: formData
    });

    const result = await res.json();
    sessionResults.push(result);
    statusEl.innerText = result.challenge_passed ? "✅ Passed" : "❌ Failed";
    setTimeout(loadNextChallenge, 700);
}

/* Finalize */
async function finalizeSession() {
    statusEl.innerText = "🔐 Calculating trust score...";
    const res = await fetch("http://127.0.0.1:8000/v1/finalize", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ results: sessionResults, device_id: deviceId })
    });
    const final = await res.json();
    verdictScreen.style.display = "block";
    trustBar.style.width = final.trust_score + "%";
    trustLabel.innerText = `${final.trust_level.toUpperCase()} TRUST`;
}
</script>

</body>
</html>
